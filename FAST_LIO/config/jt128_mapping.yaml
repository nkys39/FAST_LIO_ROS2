/**:
    ros__parameters:
        common:
            lid_topic:  "/lidar_points"
            imu_topic:  "/lidar_imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 5                # 5 = HESAI (hesai_handler; jt128 point format x,y,z,intensity,timestamp(double),ring)
            scan_line:  128
            blind: 0.5                   # seq01 indoor; raise for seq02 outdoor
            timestamp_unit: 0            # hesai_handler converts absolute-sec timestamp to relative ms internally
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  false      # IMU shares lidar frame (hesai_lidar) -> identity extrinsic
            extrinsic_T: [ 0.0, 0.0, 0.0 ]
            extrinsic_R: [1., 0., 0.,
                          0., 1., 0.,
                          0., 0., 1.]

        publish:
            path_en: true
            scan_publish_en:  true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        # MAPPING mode: accumulate all deskewed points to a PCD, saved on SIGINT / save_map service.
        # (= jt128.yaml + pcd_save_en. gravity_align defaults true so the map's Z is gravity-aligned,
        #  same as the localization run -> robot starts at the map origin = identity initial pose.)
        # NOTE: map_file_path/traj_file_path は jt128_mapping.launch.py が ~ 展開デフォルト
        #       (map_file_path:= / traj_file_path:= 引数)で上書きする。下の値は直接 ros2 run 時のフォールバック。
        map_file_path: "/home/user/dataset/jt128/jt128_map_telecom2f_fastlio_raw.pcd"
        pcd_save:
            pcd_save_en: true            # accumulate feats_undistort (full-res) -> map_file_path on shutdown
            interval: -1

        traj_save:
            traj_save_en: true           # save FAST-LIO trajectory; traj[0] = map-origin pose = localization initial_pose
            traj_file_path: "/home/user/dataset/jt128/jt128_telecom2f_fastlio_traj.txt"
